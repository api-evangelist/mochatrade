aid: mochatrade
name: Mochatrade
description: >-
  Mochatrade is a regulated neo-brokerage for Indian traders offering onchain
  perpetual futures on US stocks and commodities. Traders access 50+ US equities
  (including TSLA, NVDA, AAPL), pre-IPO names, commodities, and crypto with up to
  20x leverage, settled in USDC on Hyperliquid, with INR on- and off-ramps via UPI
  and self-custody wallets. Founded in 2026 by IIT graduates who previously built
  a crypto wallet acquired after 2M installs, the company brings professional-grade
  derivatives execution to India's 140M+ demat account holders. Backed by Y
  Combinator (Spring 2026) and Pioneer. As of this enrichment pass Mochatrade
  publishes only a marketing landing page (a client-rendered SPA) and no public
  developer API, documentation, or developer portal surface.
